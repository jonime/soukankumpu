<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1380" role="img" aria-labelledby="map-title map-description">
	<title id="map-title">Upper parking lot</title>
	<desc id="map-description">Schematic parking map, not to scale. Left side from bottom to top: 00, 0, 1 through 18. Right side from bottom to top: 19 through 30. Spaces 19, 20, 29 and 30 are parallel bays. A pedestrian walkway runs along the left, a garbage shelter is at bottom left, a maintenance building is at right, and Miniatontie runs along the bottom.</desc>
	<style>
		text { font-family: sans-serif; fill: #26332f; }
		.space rect { fill: #ef8585; stroke: #a83c47; stroke-width: 2; }
		.space text { fill: #4b151b; font-size: 25px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
		.space.guest rect { fill: #cfe5fa; stroke: #236aa0; stroke-width: 3; }
		.space.guest text { fill: #154d7b; }
		.space:focus { outline: none; }
		.space:focus rect { stroke: #26332f; stroke-width: 5; }
		.label { font-size: 19px; text-anchor: middle; }
	</style>

	<rect width="820" height="1380" fill="#ffffff"/>
	<path d="M325 1250 V1150 H175 V100 H570 V390 H630 V820 H570 V1220 H480 V1250" fill="#e9edeb" stroke="#52635b" stroke-width="3"/>
	<path id="pathway-top" d="M75 20 H785 V100 H155 V1250 H75 Z" fill="#f4f5f4" stroke="#87918b" stroke-width="2"><title>Connected left and top walkways with a right-angle corner</title></path>
	<rect id="pathway-right" x="570" y="820" width="215" height="80" fill="#f4f5f4" stroke="#87918b" stroke-width="2"><title>Pathway heading right between parking spaces 20 and 21</title></rect>

	<g id="parking-spaces">
		<g id="left-row" transform="translate(0 -30)">
