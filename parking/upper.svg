	<rect x="185" y="1125" width="140" height="95" fill="#cbd0cc" stroke="#52635b" stroke-width="3"/>
	<text class="label" x="255" y="1179">Roskakatos</text>
	<rect x="630" y="565" width="115" height="250" fill="#f3dbac" stroke="#726142" stroke-width="3"/>
	<text class="label" transform="translate(692 690) rotate(-90)">Huoltorakennus</text>

	<rect x="55" y="1250" width="730" height="100" fill="#e3e7e5"/>
	<path d="M55 1250 H325 M480 1250 H785 V1350 H55" fill="none" stroke="#87918b" stroke-width="3"/>
	<text x="420" y="1308" font-size="30" font-weight="600" text-anchor="middle">Miniatontie</text>
</svg>
